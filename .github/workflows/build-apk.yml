name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore consistent debug signing keystore
        env:
          KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build signed APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle assembleDebug --no-daemon

      - name: Prepare versioned update & OTA manifest
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
          else
            TAG="v2.3.${GITHUB_RUN_NUMBER}"
            VERSION_NAME="2.3.${GITHUB_RUN_NUMBER}"
          fi
          APK_NAME="EternalBlue-POS-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          cat <<EOF > update-manifest.json
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "${VERSION_NAME}",
            "tagName": "${TAG}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}",
            "sha256": "${SHA256}",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          }
          EOF
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalBlue-POS-${{ steps.meta.outputs.tag }}
          path: |
            ${{ steps.meta.outputs.apk }}
            update-manifest.json

      - name: Publish GitHub Release & OTA manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: EternalBlue POS ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.meta.outputs.apk }}
            update-manifest.json
