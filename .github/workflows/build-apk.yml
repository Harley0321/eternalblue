name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          set +o pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare EternalBluePOS.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EternalBluePOS.apk

      - name: Upload EternalBluePOS APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/EternalBluePOS.apk
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="EternalBlue POS v2.3.${{ github.run_number }}"
          NOTES="Automated Android APK build #${{ github.run_number }} from commit ${{ github.sha }} [versionCode:${{ github.run_number }}]"
          APK="app/build/outputs/apk/debug/EternalBluePOS.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES"
          fi
