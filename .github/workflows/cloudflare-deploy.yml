name: Cloudflare Worker CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, Test & Verify (eternalblue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harley0321/eternalblue
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/utils/posMath.test.ts src/utils/supabaseSync.test.ts

      - name: Build production Vite bundle
        run: npm run build

      - name: Validate Wrangler Worker config
        run: node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(cfg.name!=='eternalblue') throw new Error('Unexpected worker name'); if(!fs.existsSync(cfg.main)) throw new Error('Missing worker entrypoint');"

      - name: Check optional Cloudflare API Token secret
        id: cf-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GitHub Action deploy — Cloudflare Workers Builds Git Integration deploys from main automatically."
          fi

      - name: Deploy Worker via Wrangler (when CLOUDFLARE_API_TOKEN is set)
        if: steps.cf-auth.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 30cccc3f125f4e676291be3956855ece
