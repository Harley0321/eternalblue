name: Supabase Schema Sync

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/seed.sql'
      - '.github/workflows/supabase-sync.yml'
  workflow_dispatch:

jobs:
  push-migrations:
    name: Validate & Sync Supabase (xahsyugciihrrnchufwo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harley0321/eternalblue
        uses: actions/checkout@v4

      - name: Validate Supabase config & migration SQL
        run: |
          test -f supabase/config.toml
          ls -1 supabase/migrations/*.sql >/dev/null
          grep -q 'project_id = "xahsyugciihrrnchufwo"' supabase/config.toml

      - name: Check optional CLI push secrets
        id: check-secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Supabase CLI Action secrets omitted — using native Supabase Dashboard GitHub Integration."
          fi

      - name: Setup Supabase CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "xahsyugciihrrnchufwo"

      - name: Push SQL Migrations
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
